name: Windows x64 Build

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
    - name: Prepare directories
      run: |
        mkdir %userprofile%\TBuild\Libraries\win64
        mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
        echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV
        echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        path: ${{ github.workspace }}\TBuild\AyuGramDesktop

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - uses: dtolnay/rust-toolchain@stable

    - uses: Eden-CI/msvc-dev-cmd@master
      name: Setup MSVC
      with:
        arch: x64

    - name: Prepare cache key
      shell: bash
      run: |
        PREPARE_HASH=$(sha256sum $TBUILD/AyuGramDesktop/Telegram/build/prepare/prepare.py | awk '{ print $1 }')
        echo "CACHE_KEY=$PREPARE_HASH" >> $GITHUB_ENV

    - name: Cache ThirdParty
      id: cache-thirdparty
      uses: actions/cache@v4
      with:
        path: ${{ env.TBUILD }}\ThirdParty
        key: thirdparty-win64-${{ env.CACHE_KEY }}
        restore-keys: thirdparty-win64-

    - name: Cache Libraries
      id: cache-libs
      uses: actions/cache@v4
      with:
        path: ${{ env.LibrariesPath }}\*
        key: libs-win64-${{ env.CACHE_KEY }}
        restore-keys: libs-win64-

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.LibrariesPath }}\qt*
          ${{ env.LibrariesPath }}\Qt*
        key: qt-win64-${{ env.CACHE_KEY }}
        restore-keys: qt-win64-

    - name: Prepare Libraries
      run: |
        cd %TBUILD%\AyuGramDesktop\Telegram\build\prepare
        python prepare.py skip-release silent

    - name: Configure
      run: |
        cd %TBUILD%\AyuGramDesktop\Telegram
        call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=611335 ^
          -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

    - name: Build
      run: |
        cd %TBUILD%\AyuGramDesktop\Telegram
        cmake --build ..\out --config Release --parallel 4
