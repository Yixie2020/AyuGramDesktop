name: Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ayugram-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    env:
      TBUILD: ${{ github.workspace }}\TBuild

    steps:
      - name: Prepare directories
        run: |
          mkdir %TBUILD%
          mkdir %TBUILD%\Libraries

      - name: Clone sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\AyuGramDesktop

      - name: Install ATL and build tools
        shell: powershell
        run: |
          # Install ATL component for breakpad
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --wait
          choco install ninja -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 缓存拆分：每个主要依赖单独缓存，失败后只需重编译出错的部分
      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\Qt-6.11.1
          key: win64-qt-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Restore OpenSSL cache
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\openssl3
          key: win64-openssl-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Restore FFmpeg cache
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\ffmpeg
          key: win64-ffmpeg-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Restore tg_owt cache
        id: cache-tg-owt
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\tg_owt
          key: win64-tg-owt-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Restore local libs cache
        id: cache-local
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\local
          key: win64-local-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Restore other libs cache
        id: cache-other
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\win64
          key: win64-other-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Prepare libraries
        working-directory: ${{ env.TBUILD }}\AyuGramDesktop
        run: python Telegram\build\prepare\prepare.py silent

      - name: Configure and Build
        working-directory: ${{ env.TBUILD }}\AyuGramDesktop\Telegram
        run: |
          call configure.bat -G Ninja -D CMAKE_BUILD_TYPE=Release
          cmake --build ..\out --parallel 4 --target Telegram

      - name: Package
        working-directory: ${{ env.TBUILD }}\AyuGramDesktop\out
        run: |
          mkdir release
          copy Telegram\AyuGram.exe release\
          cd release
          7z a AyuGram.zip AyuGram.exe
          certutil -hashfile AyuGram.zip SHA256 > AyuGram.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-win64
          path: ${{ env.TBUILD }}\AyuGramDesktop\out\release\*

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TBUILD }}\AyuGramDesktop\out\release\AyuGram.zip
            ${{ env.TBUILD }}\AyuGramDesktop\out\release\AyuGram.zip.sha256
          draft: false
