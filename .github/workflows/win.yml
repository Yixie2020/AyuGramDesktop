name: Windows x64 Build

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
    - name: Free disk space
      shell: powershell
      run: |
        "Pre-clean free bytes: " + (Get-PSDrive C).Free
        Remove-Item -Recurse -Force "C:\ProgramData\Android" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "$env:USERPROFILE\AppData\Local\Android" -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\ProgramData\DockerDesktop" -ErrorAction SilentlyContinue
        "Post-clean free bytes: " + (Get-PSDrive C).Free

    - name: Prepare directories
      run: |
        mkdir %GITHUB_WORKSPACE%\TBuild\Libraries\win64
        mkdir %GITHUB_WORKSPACE%\TBuild\ThirdParty

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
        path: TBuild\AyuGramDesktop

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - uses: dtolnay/rust-toolchain@stable

    - uses: Eden-CI/msvc-dev-cmd@master
      name: Setup MSVC
      with:
        arch: x64
        toolset: '14.44'

    - name: Prepare cache key
      shell: bash
      run: |
        PREPARE_HASH=$(sha256sum TBuild/AyuGramDesktop/Telegram/build/prepare/prepare.py | awk '{ print $1 }')
        echo "CACHE_KEY=$PREPARE_HASH" >> $GITHUB_ENV

    - name: Restore ThirdParty cache
      id: cache-thirdparty
      uses: actions/cache/restore@v4
      with:
        path: TBuild\ThirdParty
        key: thirdparty-win64-rel-${{ env.CACHE_KEY }}
        restore-keys: thirdparty-win64-rel-

    - name: Restore Libraries cache
      id: cache-libs
      uses: actions/cache/restore@v4
      with:
        path: TBuild\Libraries
        key: libs-win64-rel-${{ env.CACHE_KEY }}
        restore-keys: libs-win64-rel-

    - name: Restore Qt cache
      id: cache-qt
      uses: actions/cache/restore@v4
      with:
        path: |
          TBuild\Libraries\qt*
          TBuild\Libraries\Qt*
        key: qt-win64-rel-${{ env.CACHE_KEY }}
        restore-keys: qt-win64-rel-

    - name: Prepare Libraries
      id: prepare
      run: |
        cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram\build\prepare
        python prepare.py silent

    # Save right after Prepare succeeds, before Configure/Build, so a later
    # failure still keeps the ~2h dependency work. Skip when Prepare failed
    # to avoid caching half-built dependencies.
    - name: Save ThirdParty cache
      if: ${{ steps.prepare.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: TBuild\ThirdParty
        key: thirdparty-win64-rel-${{ env.CACHE_KEY }}

    - name: Save Libraries cache
      if: ${{ steps.prepare.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: TBuild\Libraries
        key: libs-win64-rel-${{ env.CACHE_KEY }}

    - name: Save Qt cache
      if: ${{ steps.prepare.outcome == 'success' }}
      uses: actions/cache/save@v4
      with:
        path: |
          TBuild\Libraries\qt*
          TBuild\Libraries\Qt*
        key: qt-win64-rel-${{ env.CACHE_KEY }}

    - name: Configure
      run: |
        cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram
        call configure.bat -G Ninja -D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c -D CMAKE_BUILD_TYPE=Release -D CMAKE_DISABLE_PRECOMPILE_HEADERS=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

    - name: Build
      run: |
        cd %GITHUB_WORKSPACE%\TBuild\AyuGramDesktop\Telegram
        cmake --build ..\out --parallel 2 > ..\build_output.txt 2>&1
        set EXITCODE=%ERRORLEVEL%
        powershell -NoProfile -Command "Get-Content ..\build_output.txt -Tail 120"
        if not %EXITCODE%==0 exit /b %EXITCODE%
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: TBuild\AyuGramDesktop\build_output.txt
        retention-days: 7

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AyuGram-Windows-x64
        path: TBuild\AyuGramDesktop\out\AyuGram.exe
        retention-days: 7
