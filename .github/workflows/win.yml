name: Windows x64 Build

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/AyuGram/AyuGramDesktop
  UPSTREAM_BRANCH: dev

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - uses: dtolnay/rust-toolchain@stable

    - name: Install ATL
      run: |
        # Add ATL component to existing VS Enterprise installation
        & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --nocache --wait 2>$null
        Write-Host "ATL installation attempted"

    - name: Cache ThirdParty Libraries
      id: cache-thirdparty
      uses: actions/cache@v4
      with:
        path: |
          Telegram/ThirdParty/rlottie
          Telegram/ThirdParty/libvpx
          Telegram/ThirdParty/libopus
        key: thirdparty-win-v1

    - name: Cache FFmpeg
      id: cache-ffmpeg
      uses: actions/cache@v4
      with:
        path: Telegram/ThirdParty/ffmpeg
        key: ffmpeg-win-v1

    - name: Cache OpenAL Soft
      id: cache-openal
      uses: actions/cache@v4
      with:
        path: Telegram/ThirdParty/openal-soft
        key: openal-win-v1

    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v4
      with:
        path: Telegram/ThirdParty/qt
        key: qt-win-v1

    - name: Prepare (silent)
      working-directory: Telegram
      run: python prepare.py -D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c

    - name: Configure
      working-directory: Telegram
      run: |
        ./configure.bat -D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c

    - name: Build
      working-directory: Telegram
      run: |
        cd build
        cmake --build . --parallel 4
