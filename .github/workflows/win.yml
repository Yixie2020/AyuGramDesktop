name: Windows

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture
        type: choice
        options: [x64]
        default: x64
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ayugram-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ inputs.architecture || 'x64' }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      TDESKTOP_API_ID: ${{ vars.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
      ARCH: ${{ inputs.architecture || 'x64' }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Validate build configuration
        run: |
          if "%TDESKTOP_API_ID%"=="" (
            echo Set repository variable TDESKTOP_API_ID before building.
            exit /b 1
          )
          if "%TDESKTOP_API_HASH%"=="" (
            echo Set repository secret TDESKTOP_API_HASH before building.
            exit /b 1
          )

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: %TBUILD%\AyuGramDesktop

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.ARCH }}

      - name: Install build tools
        run: |
          choco install ninja ccache -y
          pip install meson

      - name: Restore libraries cache
        id: libraries-cache
        uses: actions/cache@v4
        with:
          path: %TBUILD%\Libraries
          key: win64-${{ hashFiles('Telegram/build/prepare/prepare.py') }}
          restore-keys: win64-

      - name: Prepare libraries
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        working-directory: %TBUILD%\AyuGramDesktop
        run: |
          python Telegram\build\prepare\prepare.py silent

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: %USERPROFILE%\ccache
          key: ccache-win64-${{ github.sha }}
          restore-keys: ccache-win64-

      - name: Configure
        working-directory: %TBUILD%\AyuGramDesktop\Telegram
        run: |
          cmake -B ..\out -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DTDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -DTDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON

      - name: Build
        working-directory: %TBUILD%\AyuGramDesktop
        run: |
          cmake --build out --parallel 4 --target Telegram
          ccache --show-stats

      - name: Package
        working-directory: %TBUILD%\AyuGramDesktop\out
        run: |
          mkdir release
          copy Telegram\AyuGram.exe release\
          cd release
          7z a AyuGram.zip AyuGram.exe
          certutil -hashfile AyuGram.zip SHA256 > AyuGram.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-win64
          path: %TBUILD%\AyuGramDesktop\out\release\*

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            %TBUILD%\AyuGramDesktop\out\release\AyuGram.zip
            %TBUILD%\AyuGramDesktop\out\release\AyuGram.zip.sha256
          draft: false
